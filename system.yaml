# yaml-language-server: $schema=./system.schema.json
student: mgiorgetti.ieu2024
prefix: mgiorgetti-ieu2024
public_url: https://mgiorgettiieu2024ui.z6.web.core.windows.net/
ui:
  path: ui/
  storage_account: mgiorgettiieu2024ui
  calls: [rooms, game]
azure:
  resource_group: rg-sdd-3a
  container_apps_environment: mgiorgetti-ieu2024-env
  sql_server: mgiorgetti-ieu2024-sql
  registry: ghcr.io/inventure72
services:
  rooms:
    description: Owns lobby membership, bundled Demo media, and match coordination.
    path: services/rooms/
    openapi: services/rooms/openapi.json
    port_default: 8001
    health: /health
    migrations: services/rooms/migrations/
    env:
      PORT:
        description: Listening port.
        default: 8001
      DATABASE_URL:
        description: TLS SQL Server URL for the Rooms database and scoped user.
        secret: true
      SERVICE_TOKEN:
        description: Shared credential for private calls and signing game tickets.
        secret: true
      GIT_SHA:
        description: Deployed Git commit reported by health.
        default: development
      UI_ORIGIN:
        description: The exact allowed browser origin. An empty value disables cross-origin access.
        default: ""
      GAME_BASE_URL:
        description: Game's private-call HTTPS origin. An empty value disables peer calls.
        default: ""
      SSL_CERT_FILE:
        description: Optional CA certificate file for local Compose SQL TLS. Azure uses system trust.
        default: ""
    calls:
      - service: game
        url_env: GAME_BASE_URL
        endpoints:
          - POST /internal/games
          - POST /internal/rooms/{room_id}/game-lifecycle
        timeout_s: 3
        on_failure: Rooms stays available. Start and Sync return retryable 503 responses, and an unresolved Start remains reserved.
    azure:
      container_app: mgiorgetti-ieu2024-rooms
      sql_database: mgiorgetti-ieu2024-rooms-db
  game:
    description: Owns frozen matches, rounds, readiness, answers and rankings.
    path: services/game/
    openapi: services/game/openapi.json
    port_default: 8002
    health: /health
    migrations: services/game/migrations/
    env:
      PORT:
        description: Listening port.
        default: 8002
      DATABASE_URL:
        description: TLS SQL Server URL for the Game database and scoped user.
        secret: true
      SERVICE_TOKEN:
        description: Shared credential for private calls and verifying game tickets.
        secret: true
      GIT_SHA:
        description: Deployed Git commit reported by health.
        default: development
      UI_ORIGIN:
        description: The exact allowed browser origin. An empty value disables cross-origin access.
        default: ""
      SSL_CERT_FILE:
        description: Optional CA certificate file for local Compose SQL TLS. Azure uses system trust.
        default: ""
    calls: []
    azure:
      container_app: mgiorgetti-ieu2024-game
      sql_database: mgiorgetti-ieu2024-game-db
