name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rooms-sqlserver:
    name: Rooms on SQL Server 2022
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rooms and verification dependencies
        run: python -m pip install -r services/rooms/requirements.txt -r requirements-test.txt
      - name: Test real SQL Server with generated local credentials
        run: |
          python -m ruff check --select E4,E7,E9,F tools/setup_rooms_db.py tools/test_rooms_sqlserver.py
          python -m tools.test_rooms_sqlserver

  service:
    name: ${{ matrix.service }} core and API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [rooms, game]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service and verification dependencies
        run: python -m pip install -r services/${{ matrix.service }}/requirements.txt -r requirements-test.txt
      - name: Lint service and shared code
        run: python -m ruff check --select E4,E7,E9,F services/${{ matrix.service }} shared
      - name: Verify core coverage and owned API
        env:
          PYTHON: python
        run: bash tools/verify_service.sh '${{ matrix.service }}'

  regression:
    name: Monolith compatibility, frontend and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install application and verification dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r services/rooms/requirements.txt -r services/game/requirements.txt -r requirements-test.txt
      - name: Lint application source
        run: .venv/bin/python -m ruff check --select E4,E7,E9,F backend services shared
      - name: Validate OpenAPI and generated-contract drift
        run: .venv/bin/python -m tools.check_service_contracts
      - name: Run complete regression suite
        env:
          PYTHON: .venv/bin/python
        run: bash tools/verify.sh
