name: Deploy to Azure

on:
  workflow_call:
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_SQL_ADMIN_PASSWORD:
        required: true
      ROOMS_SQL_PASSWORD:
        required: true
      GAME_SQL_PASSWORD:
        required: true
      REPEAT_SERVICE_TOKEN:
        required: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  deploy:
    name: Publish and deploy the tested SHA
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: assignment2-azure
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bzip2 curl gcc libc6-dev libssl-dev make
          bash tools/build_pymssql.sh "$RUNNER_TEMP/sql-wheels"
          python -m pip install "$RUNNER_TEMP"/sql-wheels/pymssql-*.whl PyYAML==6.0.3
      - name: Verify deployment secrets are configured
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SQL_ADMIN_PASSWORD: ${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}
          ROOMS_SQL_PASSWORD: ${{ secrets.ROOMS_SQL_PASSWORD }}
          GAME_SQL_PASSWORD: ${{ secrets.GAME_SQL_PASSWORD }}
          REPEAT_SERVICE_TOKEN: ${{ secrets.REPEAT_SERVICE_TOKEN }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_SQL_ADMIN_PASSWORD ROOMS_SQL_PASSWORD GAME_SQL_PASSWORD REPEAT_SERVICE_TOKEN; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing GitHub Actions secret %s\n' "$name" >&2
              exit 1
            fi
          done
      - uses: azure/login@v2
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish commit-tagged images to GHCR
        env:
          GHCR_PUSH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_PUSH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for owner in rooms game; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/repeat-$owner:$GITHUB_SHA"
            docker build --platform linux/amd64 --provenance=false \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --file "services/$owner/Dockerfile" --tag "$image" .
            docker push "$image"
          done
          docker logout ghcr.io
      - name: Verify both images are publicly pullable
        run: |
          for owner in rooms game; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/repeat-$owner:$GITHUB_SHA"
            if ! docker manifest inspect "$image" >/dev/null; then
              printf 'Could not pull %s anonymously. Check the GitHub package visibility and rerun the deployment.\n' "$image" >&2
              exit 1
            fi
          done
      - name: Provision, deploy and verify Azure
        env:
          PREFIX: ${{ vars.PREFIX }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          UI_STORAGE: ${{ vars.UI_STORAGE }}
          AZURE_SQL_LOCATION: ${{ vars.AZURE_SQL_LOCATION }}
          AZURE_SQL_ADMIN_PASSWORD: ${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}
          ROOMS_SQL_PASSWORD: ${{ secrets.ROOMS_SQL_PASSWORD }}
          GAME_SQL_PASSWORD: ${{ secrets.GAME_SQL_PASSWORD }}
          REPEAT_SERVICE_TOKEN: ${{ secrets.REPEAT_SERVICE_TOKEN }}
        run: python -m tools.deploy_azure
